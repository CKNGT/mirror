name: Pull milvus Image
on: workflow_dispatch

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull milvusdb/milvus:v2.6.6

      - name: Save image
        run: docker save milvusdb/milvus:v2.6.6 > milvus.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: milvus
          path: milvus.tar
