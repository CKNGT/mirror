name: Pull etcd Image
on: workflow_dispatch

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull quay.io/coreos/etcd:v3.5.18

      - name: Save image
        run: docker save quay.io/coreos/etcd:v3.5.18 > etcd.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etcd
          path: etcd.tar
